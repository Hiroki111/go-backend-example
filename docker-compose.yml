version: "3.9"

services:
  redis:
    image: redis:8.4.0
    container_name: goshop-redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru

  prometheus:
    image: prom/prometheus
    container_name: goshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: goshop-grafana
    ports:
      - "3000:3000"
